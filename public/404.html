<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Sayfa Bulunamadı | alpay.fun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background-color: #050608;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      opacity: 0.25;
      z-index: 1;
    }
    .glow-1 {
      top: 15%;
      left: 20%;
      background: #a855f7;
    }
    .glow-2 {
      bottom: 15%;
      right: 20%;
      background: #38bdf8;
    }
    .error-card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 480px;
      padding: 48px 36px;
      background: rgba(18, 20, 29, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      animation: floatCard 4s ease-in-out infinite alternate;
    }
    @keyframes floatCard {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5.5rem;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #a855f7 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
    }
    .error-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .error-desc {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 28px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.85), rgba(56, 189, 248, 0.85));
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.4);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(168, 85, 247, 0.6);
      background: linear-gradient(135deg, #a855f7, #38bdf8);
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Sayfa Bulunamadı</h1>
    <p class="error-desc">Aradığınız sayfa mevcut değil veya taşınmış olabilir. Lütfen adresi kontrol edin veya ana sayfaya dönün.</p>
    <a href="/" class="btn-home">
      <i class="fa-solid fa-house"></i> Ana Sayfaya Dön
    </a>
  </div>
</body>
</html>
