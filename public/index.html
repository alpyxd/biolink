<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alpay.fun</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Main Stylesheet (Cache Busted) -->
  <link rel="stylesheet" href="/css/style.css?v=2.3.0">
</head>
<body>

  <!-- Background Media Layer -->
  <div id="bg-container" class="bg-container">
    <video id="bg-video" class="bg-media" autoplay loop muted playsinline></video>
    <img id="bg-image" class="bg-media" alt="Background">
    <div id="bg-overlay" class="bg-overlay"></div>
  </div>

  <!-- Particle Canvas Layer -->
  <canvas id="particles-canvas" class="particles-canvas"></canvas>

  <!-- Interactive Cursor Glow Trail -->
  <div id="cursor-glow" class="cursor-glow"></div>

  <!-- Top-Left Floating Audio Control Button -->
  <div class="top-left-controls">
    <button id="floating-audio-btn" class="floating-btn" title="Müziği Aç / Kapat" aria-label="Audio Toggle">
      <i id="audio-icon" class="fa-solid fa-volume-high"></i>
    </button>
  </div>

  <!-- "Click to Enter" Splash Screen (Smooth Fading) -->
  <div id="enter-overlay" class="enter-overlay" onclick="window.enterBiolink ? window.enterBiolink() : this.classList.add('hidden')">
    <div class="enter-content">
      <p id="enter-text" class="enter-text">[ TIKLA VE GİRİŞ YAP ]</p>
    </div>
  </div>

  <!-- Center Biolink Container -->
  <main class="main-wrapper">
    <div id="profile-container" class="profile-container">
      
      <!-- Horizontal Compact Identity Box (Larger & Glowing) -->
      <div class="profile-hero-row">
        <!-- Left: Square Rounded Avatar -->
        <div class="avatar-box" style="width: 155px; height: 155px; min-width: 155px; min-height: 155px; max-width: 155px; max-height: 155px; border-radius: 28px; overflow: hidden; flex-shrink: 0;">
          <img id="avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400" alt="Avatar" class="avatar-img" style="width: 155px; height: 155px; object-fit: cover; border-radius: 26px; display: block;">
        </div>

        <!-- Right: Name, Typewriter, Social Links Row -->
        <div class="profile-info-col">
          <!-- Name & Badges -->
          <div class="name-row">
            <span id="display-name-text" class="display-name">Alpay</span>
            <div id="badges-container" class="badges-container"></div>
          </div>

          <!-- Typewriter Text directly under the name -->
          <div class="typewriter-line">
            <span id="typewriter-text" class="typewriter-text">server.alpay.fun/</span>
            <span class="typewriter-cursor">|</span>
          </div>

          <!-- Horizontal Glowing Social Icons Bar -->
          <div id="social-links-bar" class="social-links-bar">
            <!-- Dynamic icons -->
          </div>
        </div>
      </div>

      <!-- Optional Bio -->
      <p id="bio-text" class="bio-text" style="display: none;"></p>

      <!-- Optional Custom Links -->
      <div id="custom-links-container" class="custom-links-container">
        <!-- Dynamic custom links -->
      </div>

    </div>
  </main>

  <!-- Bottom-Left Floating Stats & Location Badges -->
  <div class="bottom-left-stats">
    <div id="visitor-badge" class="mini-stat-badge">
      <i class="fa-regular fa-eye"></i>
      <span id="visitor-count">1</span>
    </div>
    <div id="location-badge" class="mini-stat-badge" style="display: none;">
      <i class="fa-solid fa-earth-americas"></i>
      <span id="location-text">turkiga</span>
    </div>
  </div>

  <!-- Hidden Audio Element -->
  <audio id="bg-audio" preload="auto" loop></audio>

  <!-- Admin Quick Access Gear Button -->
  <a href="/admin" class="admin-quick-btn" title="Admin Paneli">
    <i class="fa-solid fa-gear"></i>
  </a>

  <!-- Main JavaScript App (Cache Busted) -->
  <script src="/js/app.js?v=2.3.0"></script>
</body>
</html>
