<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alpay.fun</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Main Stylesheet (Cache Busted) -->
  <link rel="stylesheet" href="/css/style.css?v=5.3.0">
</head>
<body>

  <!-- Background Media Layer (Z-1) -->
  <div id="bg-container" class="bg-container">
    <video id="bg-video" class="bg-media" autoplay loop muted playsinline></video>
    <img id="bg-image" class="bg-media" alt="Background">
    <div id="bg-overlay" class="bg-overlay"></div>
  </div>

  <!-- Atmospheric Particle Canvas Layer (Z-3) -->
  <canvas id="particles-canvas" class="particles-canvas"></canvas>

  <!-- Interactive Cursor Sparks/Trail Canvas Layer (Z-4) -->
  <canvas id="cursor-canvas" class="cursor-canvas"></canvas>

  <!-- Interactive Cursor Ambient Glow (Z-4) -->
  <div id="cursor-glow" class="cursor-glow"></div>

  <!-- Top-Left Floating Audio Control Button (Fallback) -->
  <div class="top-left-controls">
    <button id="floating-audio-btn" class="floating-btn" title="Müziği Aç / Kapat" aria-label="Audio Toggle" style="display: none;">
      <i id="audio-icon" class="fa-solid fa-volume-high"></i>
    </button>
  </div>

  <!-- "Click to Enter" Splash Screen -->
  <div id="enter-overlay" class="enter-overlay" onclick="window.enterBiolink ? window.enterBiolink() : this.classList.add('hidden')">
    <div class="enter-content">
      <p id="enter-text" class="enter-text">[ TIKLA VE GİRİŞ YAP ]</p>
    </div>
  </div>

  <!-- Center Biolink Container (Layer 4) -->
  <main class="main-wrapper">
    <div id="profile-container" class="profile-container">
      
      <!-- Horizontal Compact Identity Box -->
      <div class="profile-hero-row">
        <!-- Left: Square Rounded Avatar with Toggleable Glow -->
        <div class="avatar-box" id="avatar-box">
          <img id="avatar-img" src="" alt="Avatar" class="avatar-img" style="opacity: 0; transition: opacity 0.3s ease;">
        </div>

        <!-- Right: Name, Typewriter, Bio, Social Links Row -->
        <div class="profile-info-col">
          <!-- Name & Badges -->
          <div class="name-row">
            <span id="display-name-text" class="display-name"></span>
            <div id="badges-container" class="badges-container"></div>
          </div>

          <!-- Typewriter Text directly under the name -->
          <div class="typewriter-line" id="typewriter-line" style="display: none;">
            <span id="typewriter-text" class="typewriter-text"></span>
            <span class="typewriter-cursor">|</span>
          </div>

          <!-- Bio / Description (Directly inside Info Column) -->
          <p id="bio-text" class="bio-text" style="display: none;"></p>

          <!-- Horizontal Glowing Social Icons Bar -->
          <div id="social-links-bar" class="social-links-bar"></div>
        </div>
      </div>

      <!-- Audio Player Widget (Guns.lol Style Pill with Album Art) -->
      <div id="audio-player-widget" class="audio-player-widget" style="display: none;">
        <!-- Album Art / Vinyl Cover Wrapper -->
        <div id="audio-cover-wrap" class="audio-cover-wrap" style="display: none;">
          <img id="audio-cover-img" class="audio-cover-img" src="" alt="Cover">
          <div class="audio-cover-overlay">
            <i id="audio-cover-icon" class="fa-solid fa-play"></i>
          </div>
        </div>

        <!-- Default Play/Pause Button (if no album cover) -->
        <button id="audio-widget-btn" class="audio-play-btn" aria-label="Play/Pause">
          <i id="audio-widget-icon" class="fa-solid fa-play"></i>
        </button>

        <div class="audio-track-info">
          <span id="audio-track-title" class="audio-track-title">Şarkı Başlığı</span>
          <span id="audio-track-artist" class="audio-track-artist">Sanatçı</span>
        </div>

        <!-- Animated Equalizer Bars -->
        <div id="equalizer-bars" class="equalizer-bars paused">
          <span class="bar bar-1"></span>
          <span class="bar bar-2"></span>
          <span class="bar bar-3"></span>
          <span class="bar bar-4"></span>
        </div>

        <!-- Volume Slider -->
        <div class="audio-vol-wrap">
          <i class="fa-solid fa-volume-high"></i>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" class="vol-slider">
        </div>
      </div>

      <!-- Optional Custom Links -->
      <div id="custom-links-container" class="custom-links-container"></div>

    </div>
  </main>

  <!-- Bottom-Left Floating Stats & Location Badges -->
  <div class="bottom-left-stats">
    <div id="visitor-badge" class="mini-stat-badge" style="display: none;">
      <i class="fa-regular fa-eye"></i>
      <span id="visitor-count">1</span>
    </div>
    <div id="location-badge" class="mini-stat-badge" style="display: none;">
      <i class="fa-solid fa-earth-americas"></i>
      <span id="location-text"></span>
    </div>
  </div>

  <!-- Hidden Audio Element -->
  <audio id="bg-audio" preload="auto" loop></audio>

  <!-- Main JavaScript App (Cache Busted) -->
  <script src="/js/app.js?v=5.4.0"></script>
</body>
</html>
